<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Why Flat Metrics Fail Reality</title>

<style>
:root{
  --green:#00ff88;
  --soft:#dcffee;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:monospace;
  color:var(--green);
  touch-action:manipulation;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:200;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.03) 0px,
      rgba(255,255,255,.03) 1px,
      transparent 2px,
      transparent 4px
    );
  opacity:.14;
}

#bg{
  position:fixed;
  inset:0;
  z-index:1;
}

.title{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  width:min(94vw,920px);
  text-align:center;
  font-size:clamp(12px,2vw,18px);
  line-height:1.4;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#d9fff0;
  text-shadow:0 0 14px var(--green);
  z-index:40;
}

.portal-wrap{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

#viz{
  width:min(78vw,78vh);
  height:min(78vw,78vh);
  border-radius:50%;
  display:block;
  background:
    radial-gradient(circle at center,
      rgba(0,30,12,.96),
      rgba(0,0,0,1));
  box-shadow:
    inset 0 0 100px rgba(0,255,120,.08),
    0 0 45px rgba(0,255,120,.10);
}

.subs{
  position:fixed;
  bottom:64px;
  left:50%;
  transform:translateX(-50%);
  width:min(92vw,760px);
  text-align:center;
  font-size:clamp(13px,2vw,17px);
  line-height:1.5;
  color:var(--soft);
  text-shadow:0 0 10px var(--green);
  white-space:pre-wrap;
  word-wrap:break-word;
  padding:0 12px;
  z-index:60;
  pointer-events:none;
}

.essay{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  width:min(92vw,760px);
  text-align:center;
  color:#a7ffd5;
  font-size:12px;
  text-decoration:none;
  opacity:.68;
  letter-spacing:.08em;
  z-index:70;
}

.essay:hover{
  opacity:1;
}

.status{
  position:fixed;
  top:56px;
  left:50%;
  transform:translateX(-50%);
  font-size:11px;
  opacity:.5;
  letter-spacing:.14em;
  z-index:50;
}

.glitch{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:160;
  opacity:0;
}

.glitch.active{
  animation:glitch .22s linear;
}

@keyframes glitch{
  0%{
    opacity:0;
    transform:translate(0,0);
    background:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.08) 0px,
        transparent 2px,
        transparent 5px
      );
  }
  30%{
    opacity:.24;
    transform:translate(-10px,4px);
  }
  65%{
    opacity:.16;
    transform:translate(12px,-5px);
  }
  100%{
    opacity:0;
    transform:translate(0,0);
  }
}

@media(max-width:700px){
  #viz{
    width:min(92vw,92vw);
    height:min(92vw,92vw);
  }

  .subs{
    bottom:72px;
  }

  .essay{
    width:90vw;
    font-size:11px;
  }
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="title">
  WHY FLAT METRICS FAIL REALITY
</div>

<div class="status">
  CLICK / TOUCH TO PLAY OR PAUSE
</div>

<div class="portal-wrap">
  <canvas id="viz"></canvas>
</div>

<div class="subs" id="subs"></div>

<a class="essay"
href="https://standardgalactic.github.io/alphabet/constraint-geometry/field-space.pdf"
target="_blank">
Constraint Geometry Across Scales
</a>

<div class="glitch" id="glitch"></div>

<audio id="audio" preload="auto">
  <source src="Why_Flat_Metrics_Fail_Reality.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("audio")
const subsEl = document.getElementById("subs")
const glitch = document.getElementById("glitch")

let ctxA
let analyser
let data
let started = false

function initAudio(){
  if(ctxA) return

  ctxA = new (window.AudioContext || window.webkitAudioContext)()

  analyser = ctxA.createAnalyser()
  analyser.fftSize = 2048
  analyser.smoothingTimeConstant = .84

  data = new Uint8Array(analyser.fftSize)

  const src = ctxA.createMediaElementSource(audio)
  src.connect(analyser)
  analyser.connect(ctxA.destination)
}

/* subtitles */

let cues = []

async function loadVTT(){
  cues = []

  try{
    const r = await fetch("Why_Flat_Metrics_Fail_Reality.vtt")

    if(!r.ok){
      console.warn("Missing VTT")
      return
    }

    const txt = await r.text()
    cues = parseVTT(txt)
  }catch(e){
    console.warn(e)
  }
}

function parseVTT(txt){
  const lines = txt.split('\n')
  const out = []
  let i = 0

  while(i < lines.length){
    const line = lines[i].trim()

    if(line.includes('-->')){
      const [s,e] =
        line.split('-->')
          .map(v=>v.trim())

      i++

      const text = []

      while(i < lines.length && lines[i].trim()){
        text.push(lines[i].trim())
        i++
      }

      out.push({
        start:toSec(s),
        end:toSec(e),
        text:text.join('\n')
      })
    }else{
      i++
    }
  }

  return out
}

function toSec(t){
  const p =
    t.replace(',','.')
      .split(':')

  if(p.length===3){
    return (+p[0])*3600 + (+p[1])*60 + (+p[2])
  }

  return (+p[0])*60 + (+p[1])
}

audio.ontimeupdate = ()=>{
  const t = audio.currentTime

  const cue =
    cues.find(c=>
      t >= c.start &&
      t < c.end + .25
    )

  subsEl.textContent = cue ? cue.text : ''
}

/* play / pause */

document.body.onclick = async ()=>{
  if(!started){
    started = true
    initAudio()

    if(ctxA.state !== "running"){
      await ctxA.resume()
    }

    await loadVTT()

    try{
      await audio.play()
    }catch(e){
      console.warn(e)
    }

    return
  }

  if(ctxA && ctxA.state !== "running"){
    await ctxA.resume()
  }

  if(audio.paused){
    await audio.play()
  }else{
    audio.pause()
  }
}

document.querySelector('.essay').onclick = e=>{
  e.stopPropagation()
}

/* background */

const bg = document.getElementById("bg")
const bgc = bg.getContext("2d")

let SW,SH

function resizeBG(){
  SW = bg.width = innerWidth
  SH = bg.height = innerHeight
}

resizeBG()
addEventListener('resize',resizeBG)

const points = []

for(let y=-8;y<40;y++){
  for(let x=-8;x<40;x++){
    points.push({
      x:x*60,
      y:y*60
    })
  }
}

function drawBG(t){
  bgc.clearRect(0,0,SW,SH)

  bgc.strokeStyle = "rgba(0,255,120,.05)"
  bgc.lineWidth = 1

  for(const p of points){
    const dx =
      Math.sin(p.y*.002 + t*.0004) * 18

    const dy =
      Math.cos(p.x*.002 + t*.0005) * 18

    bgc.beginPath()
    bgc.arc(p.x + dx,p.y + dy,.7,0,Math.PI*2)
    bgc.stroke()
  }

  for(let i=0;i<12;i++){
    bgc.beginPath()

    for(let x=0;x<SW;x+=20){
      const y =
        SH*.5 +
        Math.sin(x*.003 + i + t*.0004) *
        (40 + i*6)

      if(x===0) bgc.moveTo(x,y)
      else bgc.lineTo(x,y)
    }

    bgc.strokeStyle =
      `rgba(120,255,180,${.012 + i*.002})`

    bgc.stroke()
  }
}

/* glitch */

setInterval(()=>{
  glitch.classList.add('active')

  setTimeout(()=>{
    glitch.classList.remove('active')
  },220)
},42000 + Math.random()*18000)

/* portal canvas */

const canvas = document.getElementById("viz")
const c = canvas.getContext("2d")
const DPR = devicePixelRatio || 1

let W,H,CX,CY,R

function resize(){
  const s =
    Math.min(
      innerWidth*.78,
      innerHeight*.78
    )

  canvas.width = s * DPR
  canvas.height = s * DPR

  canvas.style.width = s+"px"
  canvas.style.height = s+"px"

  c.setTransform(DPR,0,0,DPR,0,0)

  W = s
  H = s
  CX = W/2
  CY = H/2
  R = Math.min(W,H)*0.38
}

resize()
addEventListener('resize',resize)

let phase = 0
let mouseX = 0
let mouseY = 0

addEventListener('mousemove',e=>{
  mouseX = e.clientX / innerWidth - .5
  mouseY = e.clientY / innerHeight - .5
})

function makeFallbackWave(){
  const wave = new Uint8Array(2048)

  for(let i=0;i<wave.length;i++){
    wave[i] =
      128 +
      Math.sin(i/60 + phase*1.2) * 42 +
      Math.sin(i/23 + phase*2.1) * 22 +
      Math.sin(i/11 + phase*3.3) * 10
  }

  return wave
}

function getWaveData(){
  if(analyser && data){
    analyser.getByteTimeDomainData(data)

    let live = false

    for(let i=0;i<data.length;i+=32){
      if(Math.abs(data[i]-128) > 1){
        live = true
        break
      }
    }

    if(live) return data
  }

  return makeFallbackWave()
}

function draw(t){
  requestAnimationFrame(draw)

  const now = t || performance.now()

  drawBG(now)

  c.fillStyle = "rgba(0,0,0,.10)"
  c.fillRect(0,0,W,H)

  const waveData = getWaveData()

  let energy = 0

  for(let i=0;i<waveData.length;i+=8){
    energy += Math.abs((waveData[i]-128)/128)
  }

  energy /= waveData.length/8

  phase += .012 + energy*.05

  const driftX = mouseX * 14
  const driftY = mouseY * 14

  c.beginPath()
  c.arc(CX,CY,R+8,0,Math.PI*2)
  c.strokeStyle = `rgba(0,255,120,${.12 + energy*.28})`
  c.lineWidth = 2
  c.stroke()

  c.save()

  c.beginPath()
  c.arc(CX,CY,R,0,Math.PI*2)
  c.clip()

  for(let i=1;i<=6;i++){
    const rr = R*(i/6)

    c.beginPath()

    for(let a=0;a<=Math.PI*2+.1;a+=.08){
      const warp =
        Math.sin(a*4 + phase + i) * 6

      const x =
        CX + Math.cos(a) * (rr + warp)

      const y =
        CY + Math.sin(a) * (rr - warp)

      if(a===0) c.moveTo(x,y)
      else c.lineTo(x,y)
    }

    c.strokeStyle =
      `rgba(120,255,180,${.01 + i*.01})`

    c.lineWidth = 1
    c.stroke()
  }

  const lag =
    Math.round(
      70 + Math.sin(phase*.4) * 40
    )

  for(let pass=0;pass<3;pass++){
    const alpha =
      pass===0 ? .10 :
      pass===1 ? .24 :
      .88

    const spread =
      pass===0 ? 1.16 :
      pass===1 ? 1.06 :
      1

    c.beginPath()

    for(let i=0;i<waveData.length;i++){
      const a = (waveData[i]-128)/128
      const b =
        (waveData[(i+lag)%waveData.length]-128)/128

      const theta =
        i/waveData.length * Math.PI*2

      const curvature =
        1 + Math.sin(theta*5 + phase) * .14

      const x =
        CX + driftX +
        Math.sin(theta*2 + phase*.7) *
        a *
        R*.78 *
        curvature *
        spread

      const y =
        CY + driftY +
        Math.cos(theta*3 + phase*.4) *
        b *
        R*.74 *
        (2-curvature) *
        spread

      if(i===0) c.moveTo(x,y)
      else c.lineTo(x,y)
    }

    c.strokeStyle =
      `rgba(120,255,180,${alpha})`

    c.lineWidth =
      pass===2
        ? 1.8 + energy*2.4
        : .8

    c.shadowBlur =
      pass===2
        ? 18 + energy*30
        : 0

    c.shadowColor = "#00ff88"
    c.stroke()
  }

  c.restore()
}

draw()
</script>

</body>
</html>
