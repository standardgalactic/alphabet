<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Why AI Text Feels Deceptively Profound</title>

<style>

:root{
  --green:#00ff88;
  --soft:#dffff0;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:monospace;
  color:var(--green);
  touch-action:manipulation;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:200;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.03) 0px,
      rgba(255,255,255,.03) 1px,
      transparent 2px,
      transparent 4px
    );

  opacity:.14;
}

#bg{
  position:fixed;
  inset:0;
  z-index:1;
}

.title{
  position:fixed;
  top:14px;
  left:50%;
  transform:translateX(-50%);

  width:min(94vw,920px);

  text-align:center;

  font-size:clamp(11px,1.8vw,17px);

  line-height:1.5;

  letter-spacing:.18em;

  text-transform:uppercase;

  color:#dcfff0;

  text-shadow:
    0 0 14px var(--green);

  z-index:50;
}

.modes{
  position:fixed;

  top:58px;
  left:50%;

  transform:translateX(-50%);

  display:flex;
  gap:14px;

  justify-content:center;
  align-items:center;

  z-index:60;

  width:min(92vw,760px);
}

.mode{

  min-width:120px;

  background:
    rgba(0,20,0,.45);

  border:
    1px solid rgba(0,255,120,.28);

  color:#baffdd;

  padding:10px 14px;

  font-size:11px;

  letter-spacing:.12em;

  text-transform:uppercase;

  cursor:pointer;

  transition:.25s;

  text-align:center;
}

.mode:hover{
  background:
    rgba(0,70,20,.55);
}

.mode.active{
  border-color:
    rgba(0,255,120,.75);

  background:
    rgba(0,255,120,.12);

  box-shadow:
    0 0 14px rgba(0,255,120,.22);

  color:#fff;
}

.status{
  position:fixed;

  top:112px;
  left:50%;

  transform:translateX(-50%);

  font-size:11px;

  opacity:.5;

  letter-spacing:.14em;

  z-index:70;
}

.portal-wrap{
  position:fixed;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;
}

#viz{
  width:min(78vw,78vh);
  height:min(78vw,78vh);

  border-radius:50%;

  background:
    radial-gradient(circle at center,
      rgba(0,30,12,.96),
      rgba(0,0,0,1));

  display:block;

  box-shadow:
    inset 0 0 100px rgba(0,255,120,.08),
    0 0 50px rgba(0,255,120,.10);
}

.subs{
  position:fixed;

  bottom:74px;
  left:50%;

  transform:translateX(-50%);

  width:min(92vw,760px);

  text-align:center;

  font-size:clamp(13px,2vw,17px);

  line-height:1.5;

  color:var(--soft);

  text-shadow:
    0 0 10px var(--green);

  white-space:pre-wrap;

  word-wrap:break-word;

  padding:0 12px;

  z-index:70;

  pointer-events:none;
}

.essay{
  position:fixed;

  bottom:18px;
  left:50%;

  transform:translateX(-50%);

  width:min(92vw,760px);

  text-align:center;

  color:#a7ffd5;

  font-size:12px;

  letter-spacing:.08em;

  text-decoration:none;

  opacity:.68;

  z-index:80;
}

.essay:hover{
  opacity:1;
}

.glitch{
  position:fixed;
  inset:0;

  pointer-events:none;

  z-index:160;

  opacity:0;
}

.glitch.active{
  animation:glitch .22s linear;
}

@keyframes glitch{

  0%{
    opacity:0;

    transform:translate(0,0);

    background:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.08) 0px,
        transparent 2px,
        transparent 5px
      );
  }

  30%{
    opacity:.24;
    transform:translate(-10px,4px);
  }

  65%{
    opacity:.16;
    transform:translate(12px,-5px);
  }

  100%{
    opacity:0;
    transform:translate(0,0);
  }
}

@media(max-width:700px){

  #viz{
    width:min(92vw,92vw);
    height:min(92vw,92vw);
  }

  .modes{
    gap:8px;
    top:66px;
  }

  .mode{
    min-width:0;
    flex:1;
    font-size:10px;
    padding:9px 6px;
  }

  .status{
    top:118px;
    font-size:10px;
  }

  .subs{
    bottom:84px;
  }

  .essay{
    width:90vw;
    font-size:11px;
  }
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="title">
  WHY AI TEXT FEELS DECEPTIVELY PROFOUND
</div>

<div class="modes">

  <button class="mode active" data-mode="lissajous">
    LISSAJOUS
  </button>

  <button class="mode" data-mode="swoop">
    SWOOP
  </button>

  <button class="mode" data-mode="staccato">
    STACCATO
  </button>

</div>

<div class="status">
  TOUCH / CLICK ANYWHERE TO PLAY OR PAUSE
</div>

<div class="portal-wrap">
  <canvas id="viz"></canvas>
</div>

<div class="subs" id="subs"></div>

<a class="essay"
href="https://standardgalactic.github.io/alphabet/epistemology/collapse-of-epistemic-coherence.pdf"
target="_blank">
The Collapse of Epistemic Coherence
</a>

<div class="glitch" id="glitch"></div>

<audio id="audio" preload="auto">
  <source src="Why_AI_text_feels_deceptively_profound.mp3" type="audio/mpeg">
</audio>

<script>

const audio = document.getElementById("audio")
const subsEl = document.getElementById("subs")
const glitch = document.getElementById("glitch")
const modeButtons = [...document.querySelectorAll('.mode')]

let mode = "lissajous"

modeButtons.forEach(btn=>{

  btn.onclick = e=>{

    e.stopPropagation()

    modeButtons.forEach(
      b=>b.classList.remove('active')
    )

    btn.classList.add('active')

    mode = btn.dataset.mode
  }
})

let ctxA
let analyser
let data
let started = false

function initAudio(){

  if(ctxA) return

  ctxA =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )()

  analyser =
    ctxA.createAnalyser()

  analyser.fftSize = 2048
  analyser.smoothingTimeConstant = .84

  data =
    new Uint8Array(
      analyser.fftSize
    )

  const src =
    ctxA.createMediaElementSource(audio)

  src.connect(analyser)
  analyser.connect(ctxA.destination)
}

/* subtitles */

let cues = []

async function loadVTT(){

  try{

    const r =
      await fetch(
        "Why_AI_text_feels_deceptively_profound.vtt"
      )

    if(!r.ok) return

    const txt =
      await r.text()

    cues =
      parseVTT(txt)

  }catch(e){

    console.warn(e)
  }
}

function parseVTT(txt){

  const lines = txt.split('\n')
  const out = []

  let i = 0

  while(i < lines.length){

    const line = lines[i].trim()

    if(line.includes('-->')){

      const [s,e] =
        line.split('-->')
            .map(v=>v.trim())

      i++

      const text = []

      while(
        i < lines.length &&
        lines[i].trim()
      ){
        text.push(lines[i].trim())
        i++
      }

      out.push({

        start:toSec(s),
        end:toSec(e),
        text:text.join('\n')

      })

    }else{
      i++
    }
  }

  return out
}

function toSec(t){

  const p =
    t.replace(',','.')
     .split(':')

  if(p.length===3){

    return (
      (+p[0])*3600 +
      (+p[1])*60 +
      (+p[2])
    )
  }

  return (
    (+p[0])*60 +
    (+p[1])
  )
}

audio.ontimeupdate = ()=>{

  const t = audio.currentTime

  const cue =
    cues.find(c=>
      t >= c.start &&
      t < c.end + .25
    )

  subsEl.textContent =
    cue ? cue.text : ''
}

/* play / pause */

document.body.onclick =
  async ()=>{

    if(!started){

      started = true

      initAudio()

      if(ctxA.state!=="running"){
        await ctxA.resume()
      }

      await loadVTT()

      try{
        await audio.play()
      }catch(e){}

      return
    }

    if(audio.paused){

      await audio.play()

    }else{

      audio.pause()
    }
  }

document.querySelector('.essay')
.onclick = e=>{

  e.stopPropagation()
}

/* background */

const bg =
  document.getElementById("bg")

const bgc =
  bg.getContext("2d")

let SW,SH

function resizeBG(){

  SW = bg.width = innerWidth
  SH = bg.height = innerHeight
}

resizeBG()

addEventListener(
  'resize',
  resizeBG
)

const stars = []

for(let i=0;i<220;i++){

  stars.push({

    x:Math.random()*SW,
    y:Math.random()*SH,
    z:Math.random()*2

  })
}

function drawBG(){

  bgc.clearRect(0,0,SW,SH)

  for(const s of stars){

    s.y += .2 + s.z*.5

    if(s.y > SH){

      s.y = -10
      s.x = Math.random()*SW
    }

    bgc.fillStyle =
      `rgba(180,255,220,${
        .04 + s.z*.06
      })`

    bgc.fillRect(
      s.x,
      s.y,
      s.z*1.4,
      s.z*1.4
    )
  }
}

/* glitch */

setInterval(()=>{

  glitch.classList.add('active')

  setTimeout(()=>{

    glitch.classList.remove('active')

  },220)

},38000 + Math.random()*14000)

/* portal */

const canvas =
  document.getElementById("viz")

const c =
  canvas.getContext("2d")

const DPR =
  devicePixelRatio || 1

let W,H,CX,CY,R

function resize(){

  const s =
    Math.min(
      innerWidth*.78,
      innerHeight*.78
    )

  canvas.width  = s * DPR
  canvas.height = s * DPR

  canvas.style.width  = s+"px"
  canvas.style.height = s+"px"

  c.setTransform(
    DPR,0,0,DPR,0,0
  )

  W = s
  H = s

  CX = W/2
  CY = H/2
  R  = Math.min(W,H)*0.38
}

resize()

addEventListener(
  'resize',
  resize
)

let phase = 0

function draw(){

  requestAnimationFrame(draw)

  drawBG()

  c.fillStyle =
    "rgba(0,0,0,.08)"

  c.fillRect(0,0,W,H)

  /* wave source */

  let waveData

  if(analyser){

    analyser.getByteTimeDomainData(data)

    waveData = data

  }else{

    waveData =
      new Uint8Array(2048)

    for(let i=0; i<waveData.length; i++){

      waveData[i] =
        128 +
        Math.sin(i/60 + phase*1.2) * 38 +
        Math.sin(i/23 + phase*2.1) * 18 +
        Math.sin(i/11 + phase*3.3) * 8
    }
  }

  /* energy */

  let energy = 0

  for(let i=0; i<waveData.length; i+=8){

    energy +=
      Math.abs(
        (waveData[i]-128)/128
      )
  }

  energy /= waveData.length/8

  phase +=
    .01 + energy*.05

  /* portal */

  c.beginPath()

  c.arc(
    CX,
    CY,
    R+8,
    0,
    Math.PI*2
  )

  c.strokeStyle =
    `rgba(0,255,120,${
      .10 + energy*.3
    })`

  c.lineWidth = 2

  c.stroke()

  c.save()

  c.beginPath()

  c.arc(
    CX,
    CY,
    R,
    0,
    Math.PI*2
  )

  c.clip()

  /* trace */

  {

    const lag =
      mode==="lissajous"
        ? 90
        : mode==="swoop"
          ? 130
          : 55

    for(let pass=0; pass<3; pass++){

      const alpha =
        pass===0 ? .10 :
        pass===1 ? .24 :
        .88

      const spread =
        pass===0 ? 1.15 :
        pass===1 ? 1.05 :
        1

      c.beginPath()

      for(let i=0; i<waveData.length; i++){

        const a =
          (waveData[i]-128)/128

        const b =
          (waveData[
            (i+lag)%waveData.length
          ]-128)/128

        const theta =
          i/waveData.length *
          Math.PI*2

        let x
        let y

        /* lissajous */

        if(mode==="lissajous"){

          x =
            CX +
            Math.sin(
              theta*2 +
              phase
            ) *
            a *
            R*.82 *
            spread

          y =
            CY +
            Math.cos(
              theta*3 +
              phase*.6
            ) *
            b *
            R*.78 *
            spread
        }

        /* swoop */

        else if(mode==="swoop"){

          const rr =
            R*.18 +
            (i/waveData.length) *
            R*.72

          x =
            CX +
            Math.cos(
              theta*3 +
              phase*.8
            ) *
            rr *
            a *
            spread

          y =
            CY +
            Math.sin(
              theta*2 +
              phase*.5
            ) *
            rr *
            b *
            spread
        }

        /* staccato */

        else{

          const step =
            Math.round(
              Math.sin(
                theta*12 +
                phase
              ) * 10
            ) / 10

          x =
            CX +
            step *
            a *
            R*.88 *
            spread

          y =
            CY +
            Math.sign(
              Math.cos(
                theta*8 +
                phase*.5
              )
            ) *
            b *
            R*.72 *
            spread
        }

        if(i===0){

          c.moveTo(x,y)

        }else{

          c.lineTo(x,y)
        }
      }

      c.strokeStyle =
        `rgba(120,255,170,${alpha})`

      c.lineWidth =
        pass===2
          ? 1.8 + energy*2.2
          : .8

      c.shadowBlur =
        pass===2
          ? 18 + energy*28
          : 0

      c.shadowColor =
        "#00ff88"

      c.stroke()
    }
  }

  c.restore()
}

draw()

</script>

</body>
</html>
