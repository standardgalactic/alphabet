<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descent Into Reality</title>

<style>
:root{
  --fg:#7cffc4;
  --fg-dim:rgba(124,255,196,0.5);
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:var(--fg);
  font-family:monospace;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.05) 0px,
      rgba(255,255,255,0.05) 1px,
      transparent 2px,
      transparent 4px
    );
  opacity:0.15;
}

.title-top{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  font-size:13px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  text-shadow:0 0 8px var(--fg);
  text-align:center;
  z-index:10;
}

.hud{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  width:min(92vw,800px);
  text-align:center;
  z-index:10;
}

#sub{
  min-height:2.5em;
  font-size:14px;
  color:#baffea;
  text-shadow:0 0 6px var(--fg);
}

.essay-link{
  color:var(--fg);
  text-decoration:none;
  border-bottom:1px solid var(--fg-dim);
}

.essay-link:hover{
  color:#fff;
  border-bottom-color:#fff;
}
</style>
</head>

<body>

<canvas id="view"></canvas>

<div class="title-top">Reality Is What Survives Elimination</div>

<div class="hud">
  <div id="sub"></div>
  <div>
    <a class="essay-link" href="https://standardgalactic.github.io/alphabet/framework/descent-into-reality.pdf" target="_blank">
      Descent into Reality
    </a>
  </div>
</div>

<audio id="audio" preload="auto" playsinline>
  <source src="Reality-is-what-survives-elimination.mp3" type="audio/mpeg">
  <track src="Reality-is-what-survives-elimination.vtt" kind="subtitles" default>
</audio>

<script>
const canvas = document.getElementById('view')
const ctx = canvas.getContext('2d')
const audio = document.getElementById('audio')
const subEl = document.getElementById('sub')

let w, h, cx, cy
function resize(){
  w = canvas.width = innerWidth
  h = canvas.height = innerHeight
  cx = w / 2
  cy = h / 2
}
resize()
addEventListener('resize', resize)

let audioCtx, analyser, buf, freq

function initAudio(){
  if(audioCtx) return
  audioCtx = new (window.AudioContext || window.webkitAudioContext)()
  analyser = audioCtx.createAnalyser()
  analyser.fftSize = 1024
  buf = new Uint8Array(analyser.fftSize)
  freq = new Uint8Array(analyser.frequencyBinCount)

  const src = audioCtx.createMediaElementSource(audio)
  src.connect(analyser)
  analyser.connect(audioCtx.destination)
}

async function togglePlay(){
  initAudio()
  if(audioCtx.state === 'suspended') await audioCtx.resume()

  if(audio.paused){
    await audio.play()
  }else{
    audio.pause()
  }
}

canvas.addEventListener('click', togglePlay)
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault()
  togglePlay()
}, { passive:false })

function bindSubs(){
  const tt = audio.textTracks[0]
  if(!tt) return
  tt.mode = 'hidden'
  tt.oncuechange = () => {
    const cue = tt.activeCues && tt.activeCues[0]
    subEl.textContent = cue ? cue.text : ''
  }
}
audio.addEventListener('loadedmetadata', bindSubs)
audio.addEventListener('canplay', bindSubs)

function drawPlayIcon(R){
  const size = R * 0.22
  ctx.save()
  ctx.beginPath()
  ctx.moveTo(cx - size * 0.35, cy - size * 0.55)
  ctx.lineTo(cx - size * 0.35, cy + size * 0.55)
  ctx.lineTo(cx + size * 0.65, cy)
  ctx.closePath()
  ctx.fillStyle = 'rgba(124,255,196,0.85)'
  ctx.shadowColor = '#7cffc4'
  ctx.shadowBlur = 18
  ctx.fill()
  ctx.restore()
}

function draw(){
  ctx.fillStyle = 'rgba(0,0,0,0.2)'
  ctx.fillRect(0, 0, w, h)

  const R = Math.min(w, h) * 0.45

  let amp = 0
  let treble = 0

  if(analyser){
    analyser.getByteTimeDomainData(buf)
    analyser.getByteFrequencyData(freq)

    for(let i = 0; i < buf.length; i += 8){
      amp += Math.abs((buf[i] - 128) / 128)
    }
    amp /= (buf.length / 8)

    const start = Math.floor(freq.length * 0.6)
    for(let i = start; i < freq.length; i++){
      treble += freq[i] / 255
    }
    treble /= Math.max(1, freq.length - start)
  }

  const jitterX = (Math.random() - 0.5) * treble * 20
  const jitterY = (Math.random() - 0.5) * treble * 10

  ctx.save()
  ctx.beginPath()
  ctx.arc(cx, cy, R, 0, Math.PI * 2)
  ctx.clip()

  const depth = 40
  for(let i = depth; i >= 0; i--){
    const z = (i / depth + performance.now() * 0.0003) % 1
    const r = (1 - z) * R

    ctx.beginPath()
    ctx.arc(cx + jitterX, cy + jitterY, r, 0, Math.PI * 2)
    ctx.strokeStyle = `rgba(124,255,196,${0.05 + amp * 0.2})`
    ctx.lineWidth = 1.5
    ctx.stroke()
  }

  if(analyser){
    ctx.beginPath()
    const width = R * 2
    const x0 = cx - R

    for(let i = 0; i < buf.length; i++){
      const x = x0 + (i / buf.length) * width
      const y = cy + (buf[i] - 128) * (R * 0.35 / 128)
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)
    }

    ctx.strokeStyle = '#7cffc4'
    ctx.lineWidth = 1.5
    ctx.shadowColor = '#7cffc4'
    ctx.shadowBlur = 10
    ctx.stroke()
    ctx.shadowBlur = 0
  }

  ctx.restore()

  ctx.beginPath()
  ctx.arc(cx, cy, R, 0, Math.PI * 2)
  ctx.strokeStyle = 'rgba(124,255,196,0.6)'
  ctx.lineWidth = 2
  ctx.shadowColor = '#7cffc4'
  ctx.shadowBlur = 20
  ctx.stroke()
  ctx.shadowBlur = 0

  ctx.beginPath()
  ctx.arc(cx, cy, R * 0.98, 0, Math.PI * 2)
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'
  ctx.lineWidth = 1
  ctx.stroke()

  if(audio.paused){
    drawPlayIcon(R)
  }

  requestAnimationFrame(draw)
}

draw()
</script>

</body>
</html>
