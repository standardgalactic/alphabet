<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Entropy’s Edge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="ui">
    <h2>Entropy’s Edge</h2>

    <div class="row">
      <label>Overlay</label>
      <select id="overlay">
        <option value="phi">Φ</option>
        <option value="S">Entropy S</option>
        <option value="v">|v|</option>
        <option value="mix" selected>Composite</option>
      </select>
    </div>

    <div class="row">
      <label>Map Layers</label>
      <select id="layers">
        <option value="none">None</option>
        <option value="political">Political</option>
        <option value="corridors">Corridors</option>
        <option value="both" selected>Both</option>
      </select>
    </div>

    <div class="row">
      <label>Routes</label>
      <select id="routes">
        <option value="off" selected>Off</option>
        <option value="on">On</option>
      </select>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script type="module" src="main.js"></script>
</body>
</html>
