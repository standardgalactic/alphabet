<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Univalent Photonics</title>

<style>

:root{
  --green:#7cffc4;
}

body{
  margin:0;
  background:#010201;
  overflow:hidden;

  font-family:monospace;
  color:var(--green);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  min-height:100vh;
  cursor:pointer;
}

/* faint scanlines */
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 2px,
      transparent 4px
    );

  opacity:0.10;
}

/* title */
.title{
  margin-bottom:10px;

  font-size:14px;
  letter-spacing:0.18em;
  text-transform:uppercase;

  color:#00ff88;

  text-shadow:
    0 0 10px #00ff66;
}

/* portal */
canvas{
  width:min(460px,88vw);
  height:min(460px,88vw);

  border-radius:50%;

  background:
    radial-gradient(circle at center,
      #101410 0%,
      #000 100%);

  border:2px solid rgba(0,255,120,0.32);

  box-shadow:
    0 0 30px rgba(0,255,120,0.12),
    inset 0 0 100px rgba(0,255,120,0.07);
}

/* subtitles */
.subs{
  position:fixed;

  bottom:38px;

  width:min(560px,92vw);

  min-height:2em;

  padding:6px 10px;

  text-align:center;
  line-height:1.45;
  font-size:14px;

  color:#d8ffe8;

  text-shadow:
    0 0 6px #00ff66;

  background:
    rgba(0,20,0,0.28);

  border:
    1px solid rgba(0,255,120,0.14);

  border-radius:6px;

  pointer-events:none;
}

/* essay link */
.link{
  position:fixed;

  bottom:8px;

  width:min(560px,92vw);

  text-align:center;

  font-size:12px;

  color:#7cffc4;

  opacity:0.72;

  text-decoration:none;
}

.link:hover{
  opacity:1;
}

</style>
</head>

<body>

<div class="title">
  Univalent Photonics
</div>

<canvas id="viz"></canvas>

<div class="subs" id="subs"></div>

<a class="link"
   href="https://standardgalactic.github.io/alphabet/physics/univalent-photonics.pdf"
   target="_blank">
  Univalent Photonics
</a>

<audio id="audio" preload="auto">
  <source
    src="Univalent_photonics_and_the_persistence_of_identity.mp3"
    type="audio/mpeg">
</audio>

<script>

/* ─────────────────────────────────────
   ELEMENTS
───────────────────────────────────── */

const audio =
  document.getElementById("audio");

const subs =
  document.getElementById("subs");

const canvas =
  document.getElementById("viz");

const g =
  canvas.getContext("2d");

/* prevent essay click pausing */
document.querySelector(".link")
.onclick = e=>{
  e.stopPropagation();
};

/* ─────────────────────────────────────
   AUDIO
───────────────────────────────────── */

let ctxAudio;
let analyser;
let data;

function initAudio(){

  if(ctxAudio) return;

  ctxAudio =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  analyser =
    ctxAudio.createAnalyser();

  analyser.fftSize = 2048;

  data =
    new Uint8Array(
      analyser.fftSize
    );

  const src =
    ctxAudio.createMediaElementSource(audio);

  src.connect(analyser);
  analyser.connect(ctxAudio.destination);
}

/* click anywhere */
document.body.onclick = async ()=>{

  initAudio();

  if(ctxAudio.state==="suspended"){
    await ctxAudio.resume();
  }

  if(audio.paused){
    await audio.play();
  }else{
    audio.pause();
  }
};

/* ─────────────────────────────────────
   SUBTITLES
───────────────────────────────────── */

let cues = [];

async function loadVTT(file){

  cues = [];

  try{

    const r =
      await fetch(file);

    if(!r.ok){
      throw new Error(r.status);
    }

    const txt =
      await r.text();

    const blocks =
      txt.split(/\n{2,}/);

    for(const block of blocks){

      const lines =
        block.trim().split("\n");

      const ts =
        lines.find(
          l=>l.includes("-->")
        );

      if(!ts) continue;

      const [s,e] =
        ts.split("-->")
          .map(x=>x.trim());

      const cueText =
        lines
          .slice(lines.indexOf(ts)+1)
          .join(" ");

      cues.push({
        start:parseTime(s),
        end:parseTime(e),
        text:cueText
      });
    }

  }catch(err){

    console.warn(
      "VTT failed:",
      err
    );
  }
}

function parseTime(t){

  const p =
    t.replace(",",".")
     .split(":");

  return p.length===3
    ? +p[0]*3600 + +p[1]*60 + +p[2]
    : +p[0]*60 + +p[1];
}

audio.ontimeupdate = ()=>{

  const t =
    audio.currentTime;

  const cue =
    cues.find(c =>
      t >= c.start &&
      t <  c.end + 0.2
    );

  subs.textContent =
    cue ? cue.text : "";
};

/* IMPORTANT:
   underscores in subtitle filename
*/

loadVTT(
  "Univalent_photonics_and_the_persistence_of_identity.vtt"
);

/* ─────────────────────────────────────
   CANVAS
───────────────────────────────────── */

const DPR =
  window.devicePixelRatio || 1;

canvas.width  = 360 * DPR;
canvas.height = 360 * DPR;

g.scale(DPR,DPR);

let tick = 0;

/* smooth oscillation helper */

function smoothNoise(x){

  return (
    Math.sin(x)*0.5 +
    Math.sin(x*0.73)*0.28 +
    Math.sin(x*1.37)*0.14
  );
}

/* ─────────────────────────────────────
   DRAW
───────────────────────────────────── */

function draw(){

  tick++;

  /* phosphor fade */

  g.fillStyle =
    "rgba(0,6,0,0.05)";

  g.fillRect(
    0,0,360,360
  );

  const cx = 180;
  const cy = 180;
  const R  = 146;

  g.save();

  g.beginPath();

  g.arc(
    cx,
    cy,
    R,
    0,
    Math.PI*2
  );

  g.clip();

  /* ─────────────────────────────────
     PHOTONIC FIELD
  ───────────────────────────────── */

  const phase =
    tick * 0.003;

  /* curved interference shells */

  for(let i=0;i<18;i++){

    const rr =
      24 + i*10;

    g.beginPath();

    for(let a=0;a<=Math.PI*2;a+=0.03){

      const warp =
        Math.sin(
          a*4 +
          phase +
          i*0.2
        ) * 3;

      const x =
        cx +
        Math.cos(a)*(rr+warp);

      const y =
        cy +
        Math.sin(a)*(rr+warp);

      if(a===0)
        g.moveTo(x,y);
      else
        g.lineTo(x,y);
    }

    g.strokeStyle =
      `rgba(120,255,180,${
        0.012 + i*0.004
      })`;

    g.lineWidth = 1;

    g.stroke();
  }

  /* radial geometry */

  for(let i=0;i<28;i++){

    const a =
      (i/28) * Math.PI*2 +
      phase*0.3;

    const r2 =
      R *
      (
        0.7 +
        smoothNoise(
          phase+i
        )*0.08
      );

    g.beginPath();

    g.moveTo(cx,cy);

    g.lineTo(
      cx + Math.cos(a)*r2,
      cy + Math.sin(a)*r2
    );

    g.strokeStyle =
      "rgba(0,255,120,0.03)";

    g.stroke();
  }

  /* ─────────────────────────────────
     TRACE
  ───────────────────────────────── */

  if(analyser){

    analyser.getByteTimeDomainData(data);

    let energy = 0;

    for(let i=0;i<data.length;i+=8){

      energy +=
        Math.abs(
          (data[i]-128)/128
        );
    }

    energy /= (data.length/8);

    /* identity persistence:
       stable attractor geometry
    */

    const lag =
      Math.floor(
        data.length * (
          0.11 +
          smoothNoise(
            tick*0.01
          ) * 0.06
        )
      );

    const driftX =
      Math.sin(
        tick*0.0017
      ) * 10;

    const driftY =
      Math.cos(
        tick*0.0012
      ) * 8;

    /* ghost */

    g.beginPath();

    for(let i=0;i<data.length;i++){

      const a =
        (data[i]-128)/128;

      const b =
        (data[
          (i+lag)%data.length
        ]-128)/128;

      const theta =
        (i/data.length) *
        Math.PI*2;

      const radialWarp =
        1 +
        Math.sin(
          theta*6 +
          phase
        ) * 0.06;

      const x =
        cx +
        driftX +
        a * R *
        radialWarp *
        0.92;

      const y =
        cy +
        driftY +
        b * R *
        radialWarp *
        0.82;

      if(i===0)
        g.moveTo(x,y);
      else
        g.lineTo(x,y);
    }

    g.strokeStyle =
      `rgba(120,255,180,${
        0.14 + energy*0.22
      })`;

    g.lineWidth = 4;

    g.stroke();

    /* bright trace */

    g.beginPath();

    for(let i=0;i<data.length;i++){

      const a =
        (data[i]-128)/128;

      const b =
        (data[
          (i+lag)%data.length
        ]-128)/128;

      const theta =
        (i/data.length) *
        Math.PI*2;

      const radialWarp =
        1 +
        Math.sin(
          theta*6 +
          phase
        ) * 0.06;

      const x =
        cx +
        driftX +
        a * R *
        radialWarp *
        0.92;

      const y =
        cy +
        driftY +
        b * R *
        radialWarp *
        0.82;

      if(i===0)
        g.moveTo(x,y);
      else
        g.lineTo(x,y);
    }

    g.strokeStyle =
      "#7cffc4";

    g.lineWidth =
      1.5 + energy*1.8;

    g.shadowBlur =
      12 + energy*18;

    g.shadowColor =
      "#00ff88";

    g.stroke();

    g.shadowBlur = 0;
  }

  /* boundary */

  g.beginPath();

  g.arc(
    cx,
    cy,
    R,
    0,
    Math.PI*2
  );

  g.strokeStyle =
    "rgba(120,255,180,0.26)";

  g.lineWidth = 2;

  g.stroke();

  g.restore();

  requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
