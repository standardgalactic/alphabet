<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Mathematical Realities Outgrow Their Maps</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#7cff7c;
  font-family:monospace;
  touch-action:manipulation;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  cursor:pointer;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:500;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.03) 0px,
      rgba(255,255,255,.03) 1px,
      transparent 2px,
      transparent 5px
    );
  opacity:.13;
}

.title{
  position:fixed;
  top:18px;
  width:94vw;
  text-align:center;
  font-size:13px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:#00ff88;
  text-shadow:0 0 10px #00ff66;
  z-index:100;
}

.status{
  position:fixed;
  top:52px;
  opacity:.45;
  font-size:10px;
  letter-spacing:.14em;
  z-index:120;
}

canvas{
  width:min(390px,78vw);
  height:min(390px,78vw);
  border-radius:50%;
  border:3px solid rgba(0,255,120,.46);
  background:#000;
  box-shadow:
    0 0 55px rgba(0,255,120,.16) inset,
    0 0 22px rgba(0,255,0,.55);
  z-index:40;
}

.subs{
  position:fixed;
  bottom:24px;
  width:min(680px,92vw);
  min-height:2.5em;
  padding:8px 12px;
  text-align:center;
  font-size:14px;
  line-height:1.45;
  color:#aaffaa;
  text-shadow:0 0 6px #00ff66;
  background:rgba(0,20,0,.36);
  border:1px solid rgba(0,255,0,.22);
  border-radius:6px;
  pointer-events:none;
  z-index:80;
}

@media(max-width:700px){
  .title{top:14px;font-size:10px}
  .status{top:46px;font-size:9px}
  .subs{bottom:18px;font-size:13px}
}
</style>
</head>

<body>

<div class="title">How Mathematical Realities Outgrow Their Maps</div>
<div class="status">TOUCH / CLICK ANYWHERE TO PLAY OR PAUSE</div>
<canvas id="viz"></canvas>
<div id="subs" class="subs"></div>

<audio id="audio" preload="auto">
  <source src="How_Mathematical_Realities_Outgrow_Their_Maps.mp3">
</audio>

<script>
const audio = document.getElementById("audio");
const subs = document.getElementById("subs");

let audioCtx;
let analyser;
let freqData;
let timeData;

function initAudio(){
  if(audioCtx) return;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = .88;

  freqData = new Uint8Array(analyser.frequencyBinCount);
  timeData = new Uint8Array(analyser.fftSize);

  const source = audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
}

document.body.onclick = async ()=>{
  initAudio();

  if(audioCtx.state === "suspended")
    await audioCtx.resume();

  if(audio.paused)
    await audio.play();
  else
    audio.pause();
};

/* subtitles */

let cues = [];

async function loadVTT(){
  cues = [];
  subs.textContent = "";

  try{
    const res = await fetch("How_Mathematical_Realities_Outgrow_Their_Maps.vtt");

    if(!res.ok){
      console.warn("Missing VTT");
      return;
    }

    cues = parseVTT(await res.text());

  }catch(e){
    console.warn("VTT load failed:",e);
  }
}

function parseVTT(text){
  const blocks = text.replace(/\r/g,"").split(/\n{2,}/);
  const out = [];

  for(const block of blocks){
    const lines = block.trim().split("\n");
    const ts = lines.find(line=>line.includes("-->"));
    if(!ts) continue;

    const tsIndex = lines.indexOf(ts);
    const [start,end] = ts.split("-->").map(x=>x.trim());

    out.push({
      start:parseTime(start),
      end:parseTime(end),
      text:lines.slice(tsIndex+1).join(" ")
    });
  }

  return out;
}

function parseTime(t){
  t = t.split(" ")[0].replace(",",".");
  const p = t.split(":");

  if(p.length === 3)
    return (+p[0])*3600 + (+p[1])*60 + parseFloat(p[2]);

  return (+p[0])*60 + parseFloat(p[1]);
}

audio.ontimeupdate = ()=>{
  const t = audio.currentTime;
  const cue = cues.find(c=>t>=c.start && t<c.end+.2);
  subs.textContent = cue ? cue.text : "";
};

loadVTT();

/* visualizer */

const canvas = document.getElementById("viz");
const ctx = canvas.getContext("2d");

const W = 460;
const H = 460;
const cx = W/2;
const cy = H/2;
const R = W*.39;

canvas.width = W;
canvas.height = H;

let frame = 0;
let bass = 0;
let mid = 0;
let high = 0;

function updateEnergy(){
  if(!analyser) return;

  analyser.getByteFrequencyData(freqData);

  let b=0,m=0,h=0;

  for(let i=0;i<38;i++) b += freqData[i];
  for(let i=38;i<170;i++) m += freqData[i];
  for(let i=170;i<freqData.length;i++) h += freqData[i];

  bass += (b/(38*255)-bass)*.08;
  mid += (m/(132*255)-mid)*.06;
  high += (h/((freqData.length-170)*255)-high)*.05;
}

function clearPortal(){
  ctx.fillStyle = "rgba(0,5,0,.095)";
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.clip();

  const g = ctx.createRadialGradient(cx,cy,0,cx,cy,R);
  g.addColorStop(0,"rgba(0,34,14,.25)");
  g.addColorStop(.70,"rgba(0,8,0,.44)");
  g.addColorStop(1,"rgba(0,0,0,.96)");

  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  drawStars();

  ctx.restore();

  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle = "rgba(124,255,196,.36)";
  ctx.lineWidth = 3;
  ctx.shadowBlur = 12;
  ctx.shadowColor = "#00ff66";
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawStars(){
  ctx.fillStyle = "rgba(180,255,210,.14)";

  for(let i=0;i<32;i++){
    const x = ((Math.sin(i*91.7)*43758.5453)%1+1)%1;
    const y = ((Math.sin(i*47.3+2)*19341.13)%1+1)%1;
    const px = x*W;
    const py = y*H;

    const dx = px-cx;
    const dy = py-cy;

    if(dx*dx+dy*dy < R*R)
      ctx.fillRect(px,py,1.4,1.4);
  }
}

function drawMapBoundary(){
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.clip();

  const pressure =
    .5 + .5*Math.sin(frame*.012) + bass*.8;

  const oldR =
    R*(.43 + bass*.025);

  const newR =
    R*(.67 + mid*.08);

  ctx.translate(cx,cy);

  /* old ontology */
  ctx.beginPath();
  ctx.arc(0,0,oldR,0,Math.PI*2);
  ctx.strokeStyle = "rgba(124,255,196,.32)";
  ctx.lineWidth = 5;
  ctx.setLineDash([10,8]);
  ctx.stroke();
  ctx.setLineDash([]);

  /* enlarged boundary */
  ctx.beginPath();
  ctx.arc(0,0,newR,0,Math.PI*2);
  ctx.strokeStyle = `rgba(190,255,220,${.10+mid*.35})`;
  ctx.lineWidth = 4;
  ctx.shadowBlur = 14;
  ctx.shadowColor = "#00ff88";
  ctx.stroke();
  ctx.shadowBlur = 0;

  /* boundary pressure cracks */
  for(let i=0;i<10;i++){
    const a =
      i/10*Math.PI*2 +
      Math.sin(frame*.006+i)*.12;

    const r1 = oldR*.95;
    const r2 = oldR*(1.06 + pressure*.18);

    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);
    ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);

    ctx.strokeStyle = `rgba(220,255,230,${.07+pressure*.10})`;
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  ctx.restore();
}

function drawMapGrid(){
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.clip();

  ctx.translate(cx,cy);

  const oldR = R*.43;

  ctx.strokeStyle = "rgba(124,255,196,.055)";
  ctx.lineWidth = 2;

  for(let x=-oldR;x<=oldR;x+=oldR/3){
    ctx.beginPath();
    ctx.moveTo(x,-oldR);
    ctx.lineTo(x,oldR);
    ctx.stroke();
  }

  for(let y=-oldR;y<=oldR;y+=oldR/3){
    ctx.beginPath();
    ctx.moveTo(-oldR,y);
    ctx.lineTo(oldR,y);
    ctx.stroke();
  }

  ctx.restore();
}

function drawObstruction(){
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.clip();

  ctx.translate(cx,cy);

  const orbit =
    frame*.004;

  const ox =
    Math.cos(orbit)*R*.58;

  const oy =
    Math.sin(orbit*.82)*R*.34;

  const size =
    24 + bass*18;

  ctx.save();
  ctx.translate(ox,oy);
  ctx.rotate(frame*.012);

  ctx.beginPath();
  ctx.moveTo(0,-size);
  ctx.lineTo(size*.72,0);
  ctx.lineTo(0,size);
  ctx.lineTo(-size*.72,0);
  ctx.closePath();

  ctx.strokeStyle = "rgba(230,255,220,.90)";
  ctx.lineWidth = 5;
  ctx.shadowBlur = 24;
  ctx.shadowColor = "#00ff88";
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0,-size);
  ctx.lineTo(0,size);
  ctx.moveTo(-size*.72,0);
  ctx.lineTo(size*.72,0);
  ctx.strokeStyle = "rgba(124,255,196,.45)";
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.restore();

  /* halo */
  ctx.beginPath();
  ctx.arc(ox,oy,size*1.75+high*24,0,Math.PI*2);
  ctx.strokeStyle = "rgba(124,255,196,.16)";
  ctx.lineWidth = 4;
  ctx.stroke();

  ctx.restore();
}

function drawTrajectories(){
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.clip();

  ctx.translate(cx,cy);

  const oldR = R*.43;
  const newR = R*(.67 + mid*.08);

  for(let i=0;i<14;i++){
    const a =
      i/14*Math.PI*2 +
      frame*.003;

    const startR =
      oldR*(.18 + (i%4)*.16);

    const endR =
      newR*(.70 + .22*Math.sin(frame*.009+i));

    const sx = Math.cos(a)*startR;
    const sy = Math.sin(a)*startR;

    const ex = Math.cos(a+Math.sin(frame*.01+i)*.45)*endR;
    const ey = Math.sin(a+Math.cos(frame*.01+i)*.25)*endR;

    const mx =
      (sx+ex)/2 +
      Math.sin(frame*.015+i)*R*.14;

    const my =
      (sy+ey)/2 +
      Math.cos(frame*.013+i)*R*.14;

    ctx.beginPath();
    ctx.moveTo(sx,sy);
    ctx.quadraticCurveTo(mx,my,ex,ey);

    const outside =
      Math.sqrt(ex*ex+ey*ey) > oldR;

    ctx.strokeStyle =
      outside
      ? `rgba(190,255,220,${.10+mid*.35})`
      : "rgba(124,255,196,.18)";

    ctx.lineWidth =
      outside ? 5 : 3;

    ctx.lineCap = "round";
    ctx.shadowBlur = outside ? 14 : 0;
    ctx.shadowColor = "#00ff88";
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

function drawEnlargementPulse(){
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.clip();

  ctx.translate(cx,cy);

  for(let k=0;k<4;k++){
    const r =
      R*(.50 + k*.105) +
      Math.sin(frame*.012+k)*8 +
      bass*10;

    ctx.beginPath();
    ctx.arc(0,0,r,0,Math.PI*2);
    ctx.strokeStyle = `rgba(124,255,196,${.035+k*.025})`;
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  ctx.restore();
}

function drawWaveTrace(){
  if(!analyser) return;

  analyser.getByteTimeDomainData(timeData);

  const lag =
    Math.floor(timeData.length*(.15+mid*.08));

  ctx.beginPath();

  for(let i=0;i<timeData.length;i+=4){
    const a = (timeData[i]-128)/128;
    const b = (timeData[(i+lag)%timeData.length]-128)/128;

    const x =
      cx +
      a*R*.50 +
      Math.sin(frame*.008)*9;

    const y =
      cy +
      b*R*.42 +
      Math.cos(frame*.006)*7;

    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }

  ctx.strokeStyle = "rgba(124,255,196,.74)";
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.shadowBlur = 16;
  ctx.shadowColor = "#00ff66";
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function draw(){
  frame++;
  updateEnergy();

  clearPortal();
  drawMapGrid();
  drawEnlargementPulse();
  drawMapBoundary();
  drawTrajectories();
  drawObstruction();
  drawWaveTrace();

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
