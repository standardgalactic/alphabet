[metadata]
name = rsvp-stack
version = 0.1.0
description = Modular RSVP stack with Hydra experiment configs
author = Flyxion Research

[options]
packages = find:
include_package_data = True
python_requires = >=3.9
install_requires =
    hydra-core
    omegaconf
    numpy
    matplotlib
    tqdm
    wandb

[options.entry_points]
console_scripts =
    rsvp-run = rsvp_stack.main:main
    rsvp-train = rsvp_stack.train:train
