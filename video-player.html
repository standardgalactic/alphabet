<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daughters of the Air</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            margin: 0;
            padding: 2em;
            background: #0d0d0f; /* deep dark */
            color: #e4e4e7; /* soft white */
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1a1a1f;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            padding: 2em;
            border-radius: 16px;
        }
        h1 {
            text-align: center;
            color: #f0f0f5;
            margin-bottom: 1em;
            font-size: 2em;
            letter-spacing: 0.5px;
        }
        video {
            display: block;
            margin: 1.5em auto;
            max-width: 100%;
            border-radius: 12px;
            background: #000;
            box-shadow: 0 0 15px rgba(0,0,0,0.9);
        }
        .caption {
            text-align: center;
            color: #a0a0b0;
            font-size: 1.1em;
            margin-top: 0.5em;
            font-style: italic;
        }
        .footer {
            margin-top: 2em;
            text-align: center;
            font-size: 0.9em;
            color: #666;
        }
        a {
            color: #7aa2f7;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Daughters of the Air</h1>
        <video controls loop>
            <source src="Daughters of the Air.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="caption">
            An alternate <b>Little Mermaid</b> set in ancient Greece —  
            where centaurs wield advanced technology.
        </div>
        <div class="footer">
            © 2025 – Flyxion
        </div>
    </div>
</body>
</html>
