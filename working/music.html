<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invisible Map Audio Reactor</title>

<style>

:root{
  --green:#00ff88;
  --red:#ff3355;
  --blue:#55ccff;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#00ff88;
  font-family:monospace;
  touch-action:manipulation;
}

/* =========================================================
   CRT
========================================================= */

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:500;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.03) 0px,
      rgba(255,255,255,.03) 1px,
      transparent 2px,
      transparent 4px
    );

  opacity:.12;
}

/* =========================================================
   BACKGROUND
========================================================= */

#bg{
  position:fixed;
  inset:0;
  z-index:1;
}

/* =========================================================
   TITLE
========================================================= */

.title{

  position:fixed;

  top:14px;
  left:50%;

  transform:translateX(-50%);

  width:min(94vw,960px);

  text-align:center;

  font-size:clamp(12px,2vw,20px);

  letter-spacing:.25em;

  text-transform:uppercase;

  color:#d7fff0;

  text-shadow:
    0 0 14px #00ff88;

  z-index:100;
}

/* =========================================================
   TRACKLIST
========================================================= */

.tracks{

  position:fixed;

  top:56px;
  left:50%;

  transform:translateX(-50%);

  display:flex;
  flex-wrap:wrap;

  gap:8px;

  width:min(96vw,1100px);

  justify-content:center;

  z-index:110;
}

.track{

  border:
    1px solid rgba(0,255,120,.25);

  background:
    rgba(0,20,0,.4);

  color:#baffdd;

  padding:8px 10px;

  font-size:10px;

  letter-spacing:.12em;

  cursor:pointer;

  transition:.18s;

  text-transform:uppercase;
}

.track:hover{
  background:
    rgba(0,80,30,.45);
}

.track.active{

  background:
    rgba(0,255,120,.14);

  border-color:
    rgba(0,255,120,.8);

  color:#fff;

  box-shadow:
    0 0 14px rgba(0,255,120,.3);
}

/* =========================================================
   STATUS
========================================================= */

.status{

  position:fixed;

  top:108px;
  left:50%;

  transform:translateX(-50%);

  opacity:.5;

  font-size:11px;

  letter-spacing:.16em;

  z-index:120;
}

/* =========================================================
   PORTAL
========================================================= */

.portal{

  position:fixed;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;
}

#viz{

  width:min(620px,94vw);
  height:min(620px,94vw);

  border-radius:50%;

  background:
    radial-gradient(circle at center,
      rgba(0,50,20,.95),
      rgba(0,0,0,1));

  border:
    2px solid rgba(0,255,120,.38);

  box-shadow:
    inset 0 0 120px rgba(0,255,120,.06),
    inset 0 0 40px rgba(0,255,120,.08),
    0 0 40px rgba(0,255,120,.16);

  z-index:40;
}

/* =========================================================
   HUD
========================================================= */

.hud{

  position:fixed;

  bottom:18px;
  left:50%;

  transform:translateX(-50%);

  padding:10px 16px;

  background:
    rgba(0,20,0,.35);

  border:
    1px solid rgba(0,255,120,.18);

  border-radius:8px;

  font-size:11px;

  letter-spacing:.14em;

  color:#baffdd;

  z-index:150;
}

/* =========================================================
   GLITCH
========================================================= */

.glitch{
  position:fixed;
  inset:0;

  pointer-events:none;

  z-index:300;

  opacity:0;
}

.glitch.active{
  animation:glitch .18s linear;
}

@keyframes glitch{

  0%{
    opacity:0;
    transform:translate(0,0);

    background:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.08) 0px,
        transparent 2px,
        transparent 5px
      );
  }

  25%{
    opacity:.26;
    transform:translate(-14px,5px);
  }

  55%{
    opacity:.18;
    transform:translate(16px,-4px);
  }

  100%{
    opacity:0;
    transform:translate(0,0);
  }
}

/* =========================================================
   LETTER GLITCH
========================================================= */

.letter-glitch{
  animation:letterflash .14s linear;
}

@keyframes letterflash{

  0%{
    filter:none;
    transform:none;
  }

  50%{
    filter:blur(1px);
    transform:translateX(2px);
  }

  100%{
    filter:none;
    transform:none;
  }
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .tracks{
    gap:5px;
  }

  .track{
    font-size:8px;
    padding:7px 6px;
  }

  .status{
    top:132px;
    font-size:9px;
  }

  .hud{
    width:min(92vw,500px);
    text-align:center;
  }
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="title" id="title">
  INVISIBLE MAP REACTOR
</div>

<div class="tracks">

  <button class="track active">Invisible Map 01</button>
  <button class="track">Invisible Map 02</button>
  <button class="track">Invisible Map 03</button>
  <button class="track">Invisible Map 04</button>
  <button class="track">IDSK</button>
  <button class="track">Mashup</button>

</div>

<div class="status">
  TOUCH / CLICK ANYWHERE TO PLAY OR PAUSE
</div>

<div class="portal">
  <canvas id="viz"></canvas>
</div>

<div class="hud" id="hud">
  SIGNAL: STABLE
</div>

<div class="glitch" id="glitch"></div>

<audio id="audio" preload="auto"></audio>

<script>

/* =========================================================
   TRACKS
========================================================= */

const TRACKS = [

  "invisible-map-01.mp3",
  "invisible-map-02.mp3",
  "invisible-map-03.mp3",
  "invisible-map-04.mp3",
  "idsk.mp3",
  "mashup.mp3"

]

let currentTrack = 0

/* =========================================================
   ELEMENTS
========================================================= */

const audio =
  document.getElementById("audio")

const glitch =
  document.getElementById("glitch")

const hud =
  document.getElementById("hud")

const title =
  document.getElementById("title")

const buttons =
  [...document.querySelectorAll('.track')]

/* =========================================================
   AUDIO
========================================================= */

let audioCtx
let analyser
let data

function initAudio(){

  if(audioCtx) return

  audioCtx =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )()

  analyser =
    audioCtx.createAnalyser()

  analyser.fftSize = 2048

  const src =
    audioCtx.createMediaElementSource(audio)

  src.connect(analyser)
  analyser.connect(audioCtx.destination)

  data =
    new Uint8Array(
      analyser.frequencyBinCount
    )
}

/* =========================================================
   TRACK LOADING
========================================================= */

async function loadTrack(i, autoplay=true){

  currentTrack =
    ((i % TRACKS.length) + TRACKS.length)
    % TRACKS.length

  audio.src =
    TRACKS[currentTrack]

  audio.load()

  buttons.forEach(
    b=>b.classList.remove('active')
  )

  buttons[currentTrack]
    .classList.add('active')

  if(autoplay){

    try{
      await audio.play()
    }catch(e){}
  }
}

buttons.forEach((btn,i)=>{

  btn.onclick = async e=>{

    e.stopPropagation()

    await loadTrack(i,true)
  }
})

audio.addEventListener('ended',()=>{

  loadTrack(currentTrack+1,true)

})

/* =========================================================
   PLAY
========================================================= */

document.body.onclick =
  async ()=>{

    initAudio()

    if(audioCtx.state==="suspended")
      await audioCtx.resume()

    if(!audio.src){

      await loadTrack(0,true)
      return
    }

    if(audio.paused){

      audio.play()

    }else{

      audio.pause()
    }
  }

/* =========================================================
   BACKGROUND
========================================================= */

const bg =
  document.getElementById("bg")

const bgc =
  bg.getContext("2d")

let SW,SH

function resizeBG(){

  SW =
    bg.width =
      innerWidth

  SH =
    bg.height =
      innerHeight
}

resizeBG()

addEventListener(
  'resize',
  resizeBG
)

const particles = []

for(
  let i=0;
  i<420;
  i++
){

  particles.push({

    x:Math.random()*SW,
    y:Math.random()*SH,

    vx:
      (Math.random()-.5)*0.7,

    vy:
      (Math.random()-.5)*0.7,

    z:
      Math.random()*2
  })
}

function drawBG(){

  bgc.clearRect(
    0,0,SW,SH
  )

  for(const p of particles){

    p.x += p.vx
    p.y += p.vy

    if(p.x < 0) p.x = SW
    if(p.x > SW) p.x = 0

    if(p.y < 0) p.y = SH
    if(p.y > SH) p.y = 0

    bgc.fillStyle =
      `rgba(180,255,220,${
        .02 + p.z*.08
      })`

    bgc.fillRect(
      p.x,
      p.y,
      p.z*1.4,
      p.z*1.4
    )
  }

  for(let i=0; i<particles.length; i+=14){

    const a = particles[i]
    const b = particles[(i+31)%particles.length]

    bgc.beginPath()

    bgc.moveTo(a.x,a.y)
    bgc.lineTo(b.x,b.y)

    bgc.strokeStyle =
      "rgba(120,255,180,0.02)"

    bgc.stroke()
  }
}

/* =========================================================
   GLITCHES
========================================================= */

setInterval(()=>{

  glitch.classList.add(
    'active'
  )

  setTimeout(()=>{

    glitch.classList.remove(
      'active'
    )

  },180)

},18000 + Math.random()*10000)

const alphabet =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"

setInterval(()=>{

  const txt =
    title.textContent

  const pos =
    Math.floor(
      Math.random()*txt.length
    )

  const original =
    txt[pos]

  if(original===" ") return

  const replacement =
    alphabet[
      Math.floor(
        Math.random()*alphabet.length
      )
    ]

  title.classList.add(
    'letter-glitch'
  )

  title.textContent =

    txt.substring(0,pos) +
    replacement +
    txt.substring(pos+1)

  setTimeout(()=>{

    title.textContent = txt

    title.classList.remove(
      'letter-glitch'
    )

  },120)

},5000)

/* =========================================================
   CANVAS
========================================================= */

const canvas =
  document.getElementById("viz")

const ctx =
  canvas.getContext("2d")

const size = 720

canvas.width  = size
canvas.height = size

/* =========================================================
   STATE
========================================================= */

let phase = 0

let bassSmooth = 0
let midSmooth  = 0
let highSmooth = 0

let frame = 0

/* =========================================================
   DRAW
========================================================= */

function drawReactor(){

  if(analyser && data){

    analyser.getByteFrequencyData(data)

    let bass = 0
    let mid  = 0
    let high = 0

    for(let i=0;i<48;i++)
      bass += data[i]

    for(let i=48;i<220;i++)
      mid += data[i]

    for(let i=220;i<640;i++)
      high += data[i]

    bass /= 48 * 255
    mid  /= 172 * 255
    high /= 420 * 255

    bassSmooth +=
      (bass - bassSmooth) * 0.08

    midSmooth +=
      (mid - midSmooth) * 0.06

    highSmooth +=
      (high - highSmooth) * 0.05
  }

  phase +=
    0.02 + bassSmooth * 0.05

  const cx = size/2
  const cy = size/2

  ctx.save()

  ctx.beginPath()

  ctx.arc(
    cx,
    cy,
    size*0.47,
    0,
    Math.PI*2
  )

  ctx.clip()

  ctx.fillStyle =
    `rgba(0,5,0,${
      0.08 + bassSmooth*0.06
    })`

  ctx.fillRect(
    0,
    0,
    size,
    size
  )

  /* rings */

  for(let i=0;i<18;i++){

    const r =
      size *
      (0.08 + i*0.022)

    ctx.beginPath()

    for(let a=0;a<=Math.PI*2+.02;a+=0.04){

      const wave =

        Math.sin(
          a *
          (3 + i*0.15) +
          phase *
          (0.5 + i*0.02)
        ) *

        (3 + midSmooth*18)

      const x =
        cx +
        Math.cos(a) * (r + wave)

      const y =
        cy +
        Math.sin(a) * (r + wave)

      if(a===0)
        ctx.moveTo(x,y)
      else
        ctx.lineTo(x,y)
    }

    ctx.strokeStyle =
      `rgba(120,255,180,${
        0.01 + i*0.01
      })`

    ctx.stroke()
  }

  /* main trace */

  const scale =
    size *
    (0.13 + bassSmooth*0.10)

  const A =
    3 + midSmooth*1.8

  const B =
    2 + highSmooth*2

  ctx.save()

  ctx.translate(
    cx +
    Math.sin(frame*0.00022)*18,

    cy +
    Math.cos(frame*0.00017)*14
  )

  ctx.rotate(
    Math.sin(frame*0.0001)*0.2
  )

  for(let pass=0; pass<4; pass++){

    ctx.beginPath()

    const alpha =
      pass===0 ? 0.04 :
      pass===1 ? 0.12 :
      pass===2 ? 0.35 :
      0.95

    const spread =
      1 + pass*0.05

    for(let i=0;i<=1800;i++){

      const p =
        i / 1800

      const theta =
        phase +
        p * Math.PI * 2.7

      const distortion =

        Math.sin(
          theta *
          (22 + highSmooth*28) +
          frame * 0.003
        ) *

        highSmooth * 20

      const x =

        Math.sin(
          A * theta +
          bassSmooth*2
        ) *

        scale *
        spread +

        distortion

      const y =

        Math.sin(
          B * theta +
          midSmooth*1.5
        ) *

        scale *
        0.85 *
        spread

      if(i===0)
        ctx.moveTo(x,y)
      else
        ctx.lineTo(x,y)
    }

    ctx.strokeStyle =
      `rgba(120,255,180,${alpha})`

    ctx.lineWidth =
      pass===3
        ? 2 + bassSmooth*4
        : .8

    ctx.shadowBlur =
      pass===3
        ? 20 + bassSmooth*36
        : 0

    ctx.shadowColor =
      bassSmooth > .5
        ? "#ff3355"
        : "#00ff88"

    ctx.stroke()
  }

  ctx.restore()

  ctx.restore()

  /* HUD */

  const energy =
    (
      bassSmooth +
      midSmooth +
      highSmooth
    ) / 3

  if(energy > .62){

    hud.textContent =
      "SIGNAL: CASCADE EVENT"

  }else if(energy > .38){

    hud.textContent =
      "SIGNAL: REACTIVE"

  }else{

    hud.textContent =
      "SIGNAL: STABLE"
  }
}

function loop(){

  frame++

  drawBG()

  drawReactor()

  if(bassSmooth > .72){

    document.body.style.transform =

      `translate(${
        (Math.random()-.5)*4
      }px,${
        (Math.random()-.5)*4
      }px)`

  }else{

    document.body.style.transform =
      "translate(0,0)"
  }

  requestAnimationFrame(loop)
}

loop()

</script>

</body>
</html>
